        <script type="text/javascript">
          const options = {
            method: 'GET',
            headers: {
              accept: 'application/json',
              Authorization: 'Bearer eyJhbGciOiJIUzI1NiJ9.eyJhdWQiOiJmMzU5ZTRmNTQ5NjgzNjA2OGVkZGE0ODUyN2ZlOGM1OCIsInN1YiI6IjYzODZhNDE5NWVkOGU5MDA4NmFjYjMxZCIsInNjb3BlcyI6WyJhcGlfcmVhZCJdLCJ2ZXJzaW9uIjoxfQ.pFa_ru94R7Vka5oyA3EEtXDQCoCbVbRkQy9zr0fCxZU'
            }
          };

          fetch('https://api.themoviedb.org/3/movie/upcoming?language=es-MX&page=1', options)
              .then(response => response.json())
            .then(data => {
              const resultsArray = data.results; // Suponiendo que la respuesta contiene un array llamado "results"
              console.log(resultsArray);

              const moviesContainer = document.getElementById("moviesContainer1");

              // Iterar a través de cada película en el array y crear elementos en el HTML
              resultsArray.forEach((movie, index) => {
                const movieDiv = document.createElement("div");
                movieDiv.classList.add("col-lg-2");
                movieDiv.classList.add("col-6");
                movieDiv.classList.add("col-md-4");

                const imgElement = document.createElement("img");
                imgPath = "https://image.tmdb.org/t/p/original";
                imgElement.src = imgPath + movie.poster_path;
                imgElement.alt = movie.title;
                imgElement.classList.add("movie-image");

                const titleElement = document.createElement("p");
                titleElement.textContent = `${index + 1}. ${movie.title}`;

                movieDiv.appendChild(imgElement);
                movieDiv.appendChild(titleElement);
                moviesContainer.appendChild(movieDiv);
              });
            })
            .catch(err => console.error(err));

            document.addEventListener("DOMContentLoaded", function () {
                const hmbButton = document.querySelector(".hmb");
                const closeBtn = document.getElementById("closeBtn");
                const navbar = document.getElementById("navbar");

                hmbButton.addEventListener("click", function () {
                    navbar.classList.remove("hidden");
                });

                closeBtn.addEventListener("click", function () {
                    navbar.classList.add("hidden");
                });
            });
        </script>
